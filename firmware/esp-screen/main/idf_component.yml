## LVGL берём напрямую: esp_lvgl_port не подошёл — он умеет отдавать панель
## только через esp_lcd, а этой панели команды нужно слать по четырём линиям,
## чего esp_lcd не позволяет (см. panel_qspi.c). Дисплей заводим руками.
##
## Компонент AXS15231B остаётся ради тач-контроллера: он на той же микросхеме,
## но на своей шине I2C, и там всё штатно.
dependencies:
  idf:
    version: '>=5.5'
  lvgl/lvgl: '~9.2'
  espressif/esp_lcd_axs15231b: '~2.1.0'
