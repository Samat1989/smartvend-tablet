name: micromart
description: "MicroMart — приложение планшета вендингового автомата: витрина, оплата Kaspi QR и управление моторами платы M109E/BarysVend."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.28+10128
environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  usb_serial: ^0.5.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  crypto: ^3.0.5
  # Android Keystore-backed storage for the SmartVend secret + service PIN
  # (audit F3 — previously plaintext in SharedPreferences). Uses Jetpack
  # EncryptedSharedPreferences under the hood.
  flutter_secure_storage: ^9.2.2
  # Disk-persistent image cache (keyed by URL). Product image URLs change
  # whenever the image is replaced (admin uploads under a fresh random
  # filename), so URL-keyed caching self-invalidates — the catalog renders
  # from disk after a reboot instead of re-downloading from Supabase Storage.
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  package_info_plus: ^9.0.0
  video_player: ^2.11.1
  file_picker: ^11.0.2
  # Lives in `dependencies` instead of `dev_dependencies` on purpose:
  # flutter_native_splash advertises itself as a runtime Android plugin
  # but Flutter SDK 3.41.4 has a known bug where dev_dependency plugins
  # still get added to GeneratedPluginRegistrant.java for release builds
  # while their AAR is excluded from the classpath - "package
  # net.jonhanson.flutter_native_splash does not exist" at compile time.
  # Putting it in normal deps includes the AAR (~30 KB overhead) and the
  # registrant compiles. The package is only invoked manually via
  # `dart run flutter_native_splash:create` to regenerate splash assets;
  # the included runtime code is dead-stripped at the engine level.
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# Generates mipmaps from a single source PNG. Re-run whenever the logo
# changes:
#   flutter pub get
#   dart run flutter_launcher_icons
#
# Source is the EMBLEM ONLY (micromart_emblem.png, cropped out of
# micromart_logo.png) — at launcher size the "MicroMart" wordmark under it
# rendered as an illegible smudge and stole room from the mark itself.
# The two square renders differ on purpose:
#   * micromart_icon.png    — white background, mark at 72 % — legacy icon,
#                             the launcher only rounds its corners;
#   * micromart_icon_fg.png — transparent, mark at 58 % — adaptive
#                             foreground, which Android masks to an arbitrary
#                             shape and guarantees only the inner ~66 %.
#
# These live in design/, NOT lib/static/: the generator bakes them into
# native res/ drawables at build time, so shipping them in the Flutter
# asset bundle as well would just duplicate them into the APK.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "design/micromart_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "design/micromart_icon_fg.png"
  min_sdk_android: 21

# Generates native splash drawables + Android 12 splash API config from
# a single source PNG. Re-run whenever the splash image changes:
#   flutter pub get
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: design/Splash.png
  android: true
  ios: false
  fullscreen: true
  android_gravity: center
  # Android 12+ uses a centered-icon splash API. The full splash image
  # gets cropped to a circle by the OS, so we pass the same PNG but
  # accept that the OS will frame it.
  android_12:
    image: design/Splash.png
    color: "#FFFFFF"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Listed file-by-file on purpose. Declaring the directory (`lib/static/`)
  # bundled everything that ever landed there — Figma mockup exports and the
  # launcher/splash source PNGs the generators already bake into native
  # res/ — for ~2.4 MB of APK the app never loaded. Adding a new asset here
  # is one line; the directory form silently taxes every build.
  assets:
    - lib/static/logo_kaspi.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
