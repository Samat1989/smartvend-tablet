
# static_qr payment functions. verify_jwt MUST be false: the project uses the
# new publishable key (sb_publishable_…) which is not a JWT, so verify_jwt=true
# rejects the storefront's requests with 401 "Invalid JWT". These functions are
# public payment endpoints (no secret is exposed; the amount is computed
# server-side), so anon access is intended.
[functions.create-payment]
enabled = true
verify_jwt = false

[functions.verify-payment]
enabled = true
verify_jwt = false

# Server-side reconciliation, invoked by the pg_cron job 'reconcile-payments'
# (no JWT — called from the DB via net.http_post).
[functions.cron-process-payments]
enabled = true
verify_jwt = false

# Push-based finalization from the ESP32 relay. On a SmartVend MQTT "Processed
# order" event the device POSTs { orderid } here with the publishable key (not a
# JWT) — so verify_jwt MUST be false. The function re-verifies the payment with
# the gateway before recording, so the public endpoint can't be used to forge a
# sale.
[functions.complete-order]
enabled = true
verify_jwt = false
entrypoint = "./functions/complete-order/index.ts"

# Device provisioning: ESP32 sends a machid, gets back its MQTT identity
# (uuid/secret/name) looked up from the public SmartVend machine list — the
# device can't download that 1.85MB list itself. verify_jwt=false (publishable
# key, not a JWT).
[functions.device-provision]
enabled = true
verify_jwt = false
entrypoint = "./functions/device-provision/index.ts"

# Admin-panel endpoints. Both are called from the browser with the operator's
# own session token, and both validate that token themselves (and, for
# admin-create-user, the app_metadata.is_superadmin flag). verify_jwt stays
# false for the same reason as above — the gateway's JWT check is satisfied by
# the publishable key alone, so it would add nothing while breaking the
# preflight/anon-key path; the real authorization lives inside the functions.

# Superadmin-only: create the Supabase Auth accounts that own micromarkets.
[functions.admin-create-user]
enabled = true
verify_jwt = false
entrypoint = "./functions/admin-create-user/index.ts"

# Owner self-service: register a machine by Internal ID + Secret. Verifies the
# pair against the SmartVend list before writing micromarkets.
[functions.device-claim]
enabled = true
verify_jwt = false
entrypoint = "./functions/device-claim/index.ts"

# Superadmin-only fleet management: list every machine, transfer one to another
# account, delete one. Needed because RLS hides other owners' machines even
# from the superadmin's browser session.
[functions.device-admin]
enabled = true
verify_jwt = false
entrypoint = "./functions/device-admin/index.ts"
