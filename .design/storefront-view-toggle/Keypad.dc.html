<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #F2F2F7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #0088FF; } a:hover { color: #0070D6; }
    .tabs { display: flex; gap: 10px; }
    .tabs > button {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 72px;
      border: 0;
      border-radius: 18px;
      background: #FFFFFF;
      color: #8E8E93;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      cursor: pointer;
      box-shadow: 0 16px 16px -8px rgba(47,46,50,0.10),
                  0 4px 4px -4px rgba(47,46,50,0.05);
      transition: background 160ms ease, color 160ms ease;
    }
    .tabs > button[data-on="1"] { background: #1C1C1E; color: #FFFFFF; }
  </style>
</helmet>

<div style="width: 533px; height: 853px; background: #F2F2F7; overflow: hidden; position: relative;">

  <div style="padding: 16px 16px 16px 16px;">
    <div class="tabs">
      <button onClick="{{ showPhotos }}" data-on="{{ photosOn }}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="8.5" r="1.8"></circle><path d="M21 15l-5-5L5 21"></path></svg>
        Фото товаров
      </button>
      <button onClick="{{ showNumbers }}" data-on="{{ numbersOn }}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h4v4H5z"></path><path d="M15 5h4v4h-4z"></path><path d="M5 15h4v4H5z"></path><path d="M15 15h4v4h-4z"></path></svg>
        Номера ячеек
      </button>
    </div>
  </div>

  <!-- Номера: плотная клавиатура, полки — разделители -->
  <sc-if value="{{ numbers }}" hint-placeholder-val="{{ true }}">
    <sc-for list="{{ shelves }}" as="sh" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 10px; padding: 0 16px 8px 16px;">
        <div style="width: 26px; height: 26px; border-radius: 8px; background: #E5E1E8; color: #5D5B5F; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{ sh.no }}</div>
        <div style="color: #8E8E93; font-size: 15px; font-weight: 600; letter-spacing: -0.3px;">{{ sh.range }}</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 0 16px 16px 16px;">
        <sc-for list="{{ sh.slots }}" as="s" hint-placeholder-count="4">
          <button onClick="{{ s.pick }}" style="{{ s.tileStyle }}">
            <span style="{{ s.numStyle }}">{{ s.n }}</span>
            <sc-if value="{{ s.inCart }}" hint-placeholder-val="{{ true }}">
              <span style="position: absolute; top: 6px; right: 6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: #0088FF; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{ s.qty }}</span>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </sc-for>
  </sc-if>

  <sc-if value="{{ photos }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 16px 10px 16px;">
      <div style="width: 26px; height: 26px; border-radius: 8px; background: #E5E1E8; color: #5D5B5F; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center;">1</div>
      <div style="color: #8E8E93; font-size: 15px; font-weight: 600; letter-spacing: -0.3px;">1 — 5</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 16px;">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="6">
        <div style="background: #FFFFFF; border-radius: 20px; overflow: hidden; box-shadow: 0 16px 16px -8px rgba(47,46,50,0.10), 0 4px 4px -4px rgba(47,46,50,0.05);">
          <div style="position: relative; height: 118px; background: #F2F2F7; display: flex; align-items: center; justify-content: center;">
            <div style="width: 46px; height: 92px; border-radius: 10px; background: {{ c.tint }};"></div>
            <div style="position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 22px; background: #0088FF; box-shadow: 0 2px 6px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </div>
          </div>
          <div style="height: 54px; padding: 6px 12px 10px 12px; display: flex; align-items: flex-end; justify-content: space-between; gap: 6px;">
            <div style="color: #1C1C1E; font-size: 14px; font-weight: 600; letter-spacing: -0.2px;">{{ c.name }}</div>
            <div style="color: #FF8D28; font-size: 18px; font-weight: 800; white-space: nowrap;">{{ c.price }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 22px 16px; display: flex; justify-content: center;">
    <div style="display: flex; align-items: center; gap: 14px; height: 62px; padding: 0 10px 0 22px; border-radius: 31px; background: #1C1C1E; box-shadow: 0 16px 16px -8px rgba(47,46,50,0.24);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2 3h3l2.4 11.3a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 7H6"></path></svg>
      <div>
        <div style="color: #8E8E93; font-size: 10px; font-weight: 800; letter-spacing: 1.2px;">КОРЗИНА</div>
        <div style="color: #FFFFFF; font-size: 17px; font-weight: 800; letter-spacing: -0.4px;">{{ cartLabel }}</div>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"numberSize":{"editor":"range","default":40,"min":24,"max":60,"step":2,"unit":"px","section":"Номера"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { numbers: true, cart: { 3: 2 } };
  }

  tile(n, size) {
    const qty = this.state.cart[n] ?? 0;
    const inCart = qty > 0;
    return {
      n: String(n),
      qty: String(qty),
      inCart,
      tileStyle: [
        'position: relative',
        'appearance: none',
        'border: 0',
        'font: inherit',
        'cursor: pointer',
        'height: 84px',
        'border-radius: 16px',
        'background: #FFFFFF',
        'display: flex',
        'align-items: center',
        'justify-content: center',
        inCart
          ? 'box-shadow: inset 0 0 0 2px #0088FF'
          : 'box-shadow: 0 4px 4px -4px rgba(47,46,50,0.10)',
      ].join('; '),
      numStyle: [
        'font-size: ' + size + 'px',
        'font-weight: 800',
        'letter-spacing: -1.2px',
        'line-height: 1',
        'color: #1C1C1E',
      ].join('; '),
      pick: () => {
        const next = { ...this.state.cart };
        next[n] = (next[n] ?? 0) + 1;
        this.setState({ cart: next });
      },
    };
  }

  renderVals() {
    const size = this.props.numberSize ?? 40;
    const numbers = this.state.numbers;
    const count = Object.values(this.state.cart).reduce((a, b) => a + b, 0);

    const shelves = [
      { no: '1', range: '1 — 8', from: 1 },
      { no: '2', range: '9 — 16', from: 9 },
    ].map((sh) => ({
      no: sh.no,
      range: sh.range,
      slots: [0, 1, 2, 3, 4, 5, 6, 7].map((i) => this.tile(sh.from + i, size)),
    }));

    const tints = ['#C8102E', '#C8102E', '#00A651', '#00A651', '#7B3F98', '#1C1C1E'];
    const names = ['Coca-cola', 'Coca-cola', 'Sprite', 'Sprite', 'Джумка', 'Gorilla'];
    const cards = [1, 2, 3, 4, 5, 6].map((n, i) => ({
      n: String(n),
      tint: tints[i],
      name: names[i],
      price: (i > 3 ? 2 : 1) + ' ₸',
    }));

    return {
      numbers,
      photos: !numbers,
      numbersOn: numbers ? '1' : '0',
      photosOn: numbers ? '0' : '1',
      showNumbers: () => this.setState({ numbers: true }),
      showPhotos: () => this.setState({ numbers: false }),
      shelves,
      cards,
      cartLabel: count + (count === 1 ? ' товар' : ' товара'),
    };
  }
}
</script>
</body>
</html>
