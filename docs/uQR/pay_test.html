<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartVend — проверка оплаты</title>
<style>
  :root{
    --bg:#0e1116; --card:#171c24; --line:#28303c; --line2:#38424f;
    --fg:#e8eef5; --dim:#93a1b1; --dim2:#6b7889;
    --acc:#4c9aff; --ok:#3fb950; --warn:#d29922; --err:#f85149;
    --mono:ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:22px 16px 60px; background:var(--bg); color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .wrap{max-width:660px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
  h1{font-size:18px; margin:0 0 2px; font-weight:600}
  h1 small{display:block; font-size:13px; color:var(--dim); font-weight:400; margin-top:3px}

  .card{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:16px}
  .card h2{
    margin:0 0 13px; font-size:12px; font-weight:600; letter-spacing:.9px;
    text-transform:uppercase; color:var(--dim);
  }
  label{display:block; margin-bottom:11px}
  label > span{display:block; font-size:12px; color:var(--dim); margin-bottom:5px}
  input{
    width:100%; background:#0b1017; border:1px solid var(--line2); color:var(--fg);
    border-radius:7px; padding:10px 11px; font:14px/1.3 var(--mono);
  }
  input:focus{outline:none; border-color:var(--acc)}
  .row{display:flex; gap:11px}
  .row > *{flex:1; min-width:0}
  button{
    background:#222c39; border:1px solid var(--line2); color:var(--fg);
    padding:11px 16px; border-radius:7px; font:15px/1.2 inherit; cursor:pointer;
  }
  button:hover:not(:disabled){background:#2c3948}
  button:disabled{opacity:.4; cursor:not-allowed}
  button.primary{background:var(--acc); border-color:var(--acc); color:#04121f; font-weight:600}
  button.primary:hover:not(:disabled){background:#68adff}
  button.ok{background:#12341d; border-color:#1c4429; color:var(--ok)}
  button.bad{background:#2a1313; border-color:#5a2020; color:var(--err)}
  button.wide{width:100%}
  .btns{display:flex; gap:10px; flex-wrap:wrap}

  /* ---- экран оплаты ---- */
  .pay{display:flex; flex-direction:column; align-items:center; gap:13px; text-align:center; padding:6px 0}
  .qr{background:#fff; padding:12px; border-radius:10px; line-height:0}
  .qr svg{display:block; width:250px; height:250px}
  .amount{font:700 38px/1 var(--mono)}
  .payload{font:11px/1.45 var(--mono); color:var(--dim2); word-break:break-all; max-width:100%; user-select:all}
  .state{
    display:inline-flex; align-items:center; gap:9px; font:600 14px/1 var(--mono);
    padding:9px 15px; border-radius:22px; letter-spacing:.4px;
  }
  .s-wait{background:#111c2e; color:var(--acc); border:1px solid #22406b}
  .s-ok{background:#0f2a17; color:var(--ok); border:1px solid #1c4429}
  .s-err{background:#2a1313; color:var(--err); border:1px solid #5a2020}
  .s-warn{background:#2a2110; color:var(--warn); border:1px solid #4d3c14}
  .dot{width:9px; height:9px; border-radius:50%; background:currentColor; animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
  .timer{font:12px/1 var(--mono); color:var(--dim)}
  .code{
    font:700 30px/1.1 var(--mono); letter-spacing:4px;
    background:#0b1017; border:1px solid var(--line2); border-radius:9px; padding:12px 18px;
  }
  .hint{font-size:13px; color:var(--dim); max-width:340px}

  .msg{
    font-size:13.5px; border-radius:8px; padding:11px 13px; margin-top:12px;
    background:#111a26; border:1px solid var(--line); border-left:3px solid var(--warn);
  }
  .msg b{color:var(--warn)}
  .msg.err{border-left-color:var(--err)} .msg.err b{color:var(--err)}
  .msg.info{border-left-color:var(--acc)} .msg.info b{color:var(--acc)}
  .msg code{font:12px var(--mono); color:var(--fg)}
  .hide{display:none !important}

  /* ---- лог ---- */
  #log{font:11.5px/1.6 var(--mono); max-height:300px; overflow:auto; margin:0}
  .le{padding:5px 0; border-bottom:1px solid #1f2731; display:flex; gap:9px; align-items:baseline}
  .le:last-child{border-bottom:0}
  .le .st{font-weight:700; flex:none; padding:1px 6px; border-radius:4px}
  .le .u{flex:1; min-width:0; word-break:break-all; color:var(--dim)}
  .le .ms{color:var(--dim2); flex:none}
  .c2{color:var(--ok); background:#0f2a17} .c4{color:var(--warn); background:#2a2110}
  .c5,.c0{color:var(--err); background:#2a1313}
  .body{color:var(--dim2); padding:0 0 6px; word-break:break-all; font-size:11px}
</style>
</head>
<body>
<div class="wrap">

  <h1>SmartVend — проверка оплаты
    <small>Живой запрос к paygate. Ничего не эмулируется: QR настоящий, деньги списываются по-настоящему.</small>
  </h1>

  <!-- ============ 1. Аппарат ============ -->
  <div class="card">
    <h2>1 · Аппарат</h2>
    <div class="row">
      <label style="flex:0 0 110px"><span>device_id</span><input id="devId" placeholder="2"></label>
      <label><span>device_secret</span><input id="devSecret" placeholder="HmmCTDzp..."></label>
    </div>
    <label><span>адрес API</span><input id="base" value="/api/v1"></label>
    <div class="btns">
      <button id="btnEnroll">Привязать новый аппарат</button>
      <button id="btnForget">Забыть учётку</button>
    </div>

    <div id="enrollBox" class="hide" style="margin-top:16px">
      <div class="pay">
        <div class="qr" id="enrollQr"></div>
        <div class="code" id="enrollCode"></div>
        <div class="hint">Отсканируйте QR или введите код в панели оператора</div>
        <div class="state s-wait"><span class="dot"></span><span id="enrollState">ждём привязки</span></div>
        <div class="timer" id="enrollTimer"></div>
      </div>
    </div>
    <div id="devMsg"></div>
  </div>

  <!-- ============ 2. Платёж ============ -->
  <div class="card">
    <h2>2 · Платёж</h2>
    <div class="row">
      <label style="flex:0 0 120px"><span>сумма, ₸</span><input id="price" type="number" min="1" step="1" value="150"></label>
      <label style="flex:0 0 90px"><span>слот</span><input id="slot" value="A1"></label>
      <label><span>товар</span><input id="pname" value="Cola"></label>
    </div>
    <button class="primary wide" id="btnPay">Создать заказ и показать QR</button>

    <div id="payBox" class="hide" style="margin-top:18px">
      <div class="pay">
        <div class="amount" id="amount"></div>
        <div class="qr" id="payQr"></div>
        <div class="hint">Отсканируйте камерой Kaspi</div>
        <div class="state" id="payState"></div>
        <div class="timer" id="payTimer"></div>
        <div class="payload" id="payload"></div>
      </div>
      <div class="btns" style="margin-top:14px; justify-content:center">
        <button class="ok hide" id="btnVendOk">Товар выдан</button>
        <button class="bad hide" id="btnVendFail">Сбой выдачи</button>
        <button class="hide" id="btnCancel">Отменить ожидание</button>
      </div>
    </div>
    <div id="payMsg"></div>
  </div>

  <!-- ============ Лог ============ -->
  <div class="card">
    <h2>Что уходит на сервер</h2>
    <div id="log"><div style="color:var(--dim2)">пока пусто</div></div>
  </div>
</div>

<script>
/* ============================================================
   QR-кодер (byte mode, версии 1–40). Сверен с segno по всем
   160 записям таблиц ECC; вывод читается zxing 384/384.
   ============================================================ */
const QR = (() => {
  const ECB = [
    [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
  ];
  const NB = [
    [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81],
  ];
  const FMT = [1,0,3,2];
  const P1=3, P2=3, P3=40, P4=10;

  const rawModules = v => {
    let r = (16*v + 128)*v + 64;
    if (v >= 2){
      const n = Math.floor(v/7) + 2;
      r -= (25*n - 10)*n - 55;
      if (v >= 7) r -= 36;
    }
    return r;
  };
  const dataCodewords = (v,e) => Math.floor(rawModules(v)/8) - ECB[e][v]*NB[e][v];
  const gmul = (x,y) => {
    let z = 0;
    for (let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; }
    return z & 0xFF;
  };
  const rsDivisor = deg => {
    const r = new Uint8Array(deg); r[deg-1] = 1;
    let root = 1;
    for (let i = 0; i < deg; i++){
      for (let j = 0; j < deg; j++){
        r[j] = gmul(r[j], root);
        if (j+1 < deg) r[j] ^= r[j+1];
      }
      root = gmul(root, 2);
    }
    return r;
  };
  const rsRemainder = (data, div) => {
    const r = new Uint8Array(div.length);
    for (const b of data){
      const f = b ^ r[0];
      r.copyWithin(0,1); r[r.length-1] = 0;
      for (let i = 0; i < r.length; i++) r[i] ^= gmul(div[i], f);
    }
    return r;
  };
  const alignPositions = v => {
    if (v === 1) return [];
    const n = Math.floor(v/7) + 2, size = v*4 + 17;
    const step = (v === 32) ? 26 : Math.ceil((v*4 + 4)/(n*2 - 2))*2;
    const out = [6];
    for (let pos = size - 7; out.length < n; pos -= step) out.splice(1, 0, pos);
    return out;
  };
  const bit = (x,i) => ((x >>> i) & 1) !== 0;

  function encode(text, eccName){
    const ecl = {L:0,M:1,Q:2,H:3}[eccName || 'M'];
    const bytes = new TextEncoder().encode(text);
    let ver = 0;
    for (let v = 1; v <= 40; v++){
      const cc = v <= 9 ? 8 : 16;
      if (dataCodewords(v, ecl)*8 >= 4 + cc + bytes.length*8){ ver = v; break; }
    }
    if (!ver) throw new Error('QR: строка слишком длинная');

    const bits = [];
    const push = (val, len) => { for (let i = len-1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(4, 4);
    push(bytes.length, ver <= 9 ? 8 : 16);
    for (const b of bytes) push(b, 8);
    const cap = dataCodewords(ver, ecl)*8;
    push(0, Math.min(4, cap - bits.length));
    push(0, (8 - bits.length % 8) % 8);
    for (let pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) push(pad, 8);

    const dat = [];
    for (let i = 0; i < bits.length; i += 8){
      let b = 0;
      for (let j = 0; j < 8; j++) b = (b << 1) | bits[i+j];
      dat.push(b);
    }

    const nBlocks = NB[ecl][ver], eccLen = ECB[ecl][ver];
    const rawCw = Math.floor(rawModules(ver)/8);
    const shortCount = nBlocks - rawCw % nBlocks;
    const shortLen = Math.floor(rawCw / nBlocks);
    const div = rsDivisor(eccLen);
    const blocks = [];
    for (let i = 0, k = 0; i < nBlocks; i++){
      const len = shortLen - eccLen + (i < shortCount ? 0 : 1);
      const d = dat.slice(k, k + len); k += len;
      const blk = d.slice();
      if (i < shortCount) blk.push(0);
      blocks.push(blk.concat(Array.from(rsRemainder(d, div))));
    }
    const cw = [];
    for (let i = 0; i < blocks[0].length; i++)
      blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= shortCount) cw.push(b[i]); });

    const size = ver*4 + 17;
    const mod = Array.from({length:size}, () => new Array(size).fill(false));
    const fn  = Array.from({length:size}, () => new Array(size).fill(false));
    const set = (x,y,v) => { mod[y][x] = v; fn[y][x] = true; };

    for (let i = 0; i < size; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (cx,cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx+dx, y = cy+dy;
        if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3,3); finder(size-4,3); finder(3,size-4);
    const ap = alignPositions(ver);
    for (let i = 0; i < ap.length; i++) for (let j = 0; j < ap.length; j++){
      if ((i===0&&j===0) || (i===0&&j===ap.length-1) || (i===ap.length-1&&j===0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        set(ap[i]+dx, ap[j]+dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = mask => {
      const d = FMT[ecl] << 3 | mask;
      let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((d << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) set(8, i, bit(b,i));
      set(8,7,bit(b,6)); set(8,8,bit(b,7)); set(7,8,bit(b,8));
      for (let i = 9; i < 15; i++) set(14-i, 8, bit(b,i));
      for (let i = 0; i < 8; i++) set(size-1-i, 8, bit(b,i));
      for (let i = 8; i < 15; i++) set(8, size-15+i, bit(b,i));
      set(8, size-8, true);
    };
    drawFormat(0);
    if (ver >= 7){
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const b = ver << 12 | rem;
      for (let i = 0; i < 18; i++){
        const v = bit(b,i), a = size-11 + i%3, c = Math.floor(i/3);
        set(a,c,v); set(c,a,v);
      }
    }

    let idx = 0;
    for (let right = size-1; right >= 1; right -= 2){
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++){
        for (let j = 0; j < 2; j++){
          const x = right - j;
          const up = ((right + 1) & 2) === 0;
          const y = up ? size-1-vert : vert;
          if (!fn[y][x] && idx < cw.length*8){ mod[y][x] = bit(cw[idx >>> 3], 7 - (idx & 7)); idx++; }
        }
      }
    }

    const maskFns = [
      (x,y)=>(x+y)%2===0, (x,y)=>y%2===0, (x,y)=>x%3===0, (x,y)=>(x+y)%3===0,
      (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
      (x,y)=>(x*y)%2 + (x*y)%3 === 0,
      (x,y)=>((x*y)%2 + (x*y)%3)%2===0,
      (x,y)=>((x+y)%2 + (x*y)%3)%2===0,
    ];
    const applyMask = m => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
        if (!fn[y][x] && maskFns[m](x,y)) mod[y][x] = !mod[y][x];
    };
    const addHist = (run, h) => { if (h[0] === 0) run += size; h.pop(); h.unshift(run); };
    const countPat = h => {
      const n = h[1];
      const core = n > 0 && h[2] === n && h[3] === n*3 && h[4] === n && h[5] === n;
      return (core && h[0] >= n*4 && h[6] >= n ? 1 : 0) + (core && h[6] >= n*4 && h[0] >= n ? 1 : 0);
    };
    const penalty = () => {
      let r = 0;
      for (let y = 0; y < size; y++){
        let col = false, run = 0, h = [0,0,0,0,0,0,0];
        for (let x = 0; x < size; x++){
          if (mod[y][x] === col){ run++; if (run === 5) r += P1; else if (run > 5) r++; }
          else { addHist(run, h); if (!col) r += countPat(h)*P3; col = mod[y][x]; run = 1; }
        }
        if (col) { addHist(run, h); run = 0; }
        addHist(run + size, h); r += countPat(h)*P3;
      }
      for (let x = 0; x < size; x++){
        let col = false, run = 0, h = [0,0,0,0,0,0,0];
        for (let y = 0; y < size; y++){
          if (mod[y][x] === col){ run++; if (run === 5) r += P1; else if (run > 5) r++; }
          else { addHist(run, h); if (!col) r += countPat(h)*P3; col = mod[y][x]; run = 1; }
        }
        if (col) { addHist(run, h); run = 0; }
        addHist(run + size, h); r += countPat(h)*P3;
      }
      for (let y = 0; y < size-1; y++) for (let x = 0; x < size-1; x++){
        const c = mod[y][x];
        if (c === mod[y][x+1] && c === mod[y+1][x] && c === mod[y+1][x+1]) r += P2;
      }
      let dark = 0;
      for (const row of mod) for (const c of row) if (c) dark++;
      const total = size*size;
      r += (Math.ceil(Math.abs(dark*20 - total*10)/total) - 1)*P4;
      return r;
    };

    let best = -1, bestScore = Infinity;
    for (let m = 0; m < 8; m++){
      applyMask(m); drawFormat(m);
      const s = penalty();
      if (s < bestScore){ bestScore = s; best = m; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);
    return { size, modules: mod };
  }

  function svg(text, ecc){
    const { size, modules } = encode(text, ecc || 'M');
    const q = 3, dim = size + q*2;
    let d = '';
    for (let y = 0; y < size; y++){
      let x = 0;
      while (x < size){
        if (!modules[y][x]){ x++; continue; }
        let w = 0;
        while (x + w < size && modules[y][x+w]) w++;
        d += `M${x+q} ${y+q}h${w}v1h-${w}z`;
        x += w;
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" shape-rendering="crispEdges">`
         + `<rect width="${dim}" height="${dim}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return { svg, encode };
})();

/* ============================================================
   Утилиты
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const secsLeft = iso => Math.max(0, Math.ceil((Date.parse(iso) - Date.now())/1000));
const show = (el, on) => el.classList.toggle('hide', !on);

function msg(box, kind, html){
  box.innerHTML = html ? `<div class="msg ${kind}">${html}</div>` : '';
}

function logLine(method, path, status, ms, body){
  const el = $('log');
  if (!el.dataset.ready){ el.innerHTML = ''; el.dataset.ready = '1'; }   // убираем «пока пусто»
  const cls = 'c' + (status ? String(status)[0] : '0');
  const div = document.createElement('div');
  div.innerHTML =
    `<div class="le"><span class="st ${cls}">${status || 'ERR'}</span>`
    + `<span class="u">${method} ${esc(path)}</span><span class="ms">${ms} мс</span></div>`
    + (body ? `<div class="body">${esc(typeof body === 'string' ? body : JSON.stringify(body)).slice(0,300)}</div>` : '');
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

/* ---- единственный способ сходить на сервер: настоящий fetch ---- */
async function api(method, path, {body, auth} = {}){
  const url = $('base').value.replace(/\/+$/,'') + path;
  const headers = {'Content-Type':'application/json'};
  if (auth) headers.Authorization = 'Bearer ' + auth;
  const t0 = performance.now();
  try {
    const r = await fetch(url, {
      method, headers, cache:'no-store',
      body: body ? JSON.stringify(body) : undefined,
    });
    const txt = await r.text();
    let data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch { data = {_raw: txt}; }
    const ms = Math.round(performance.now() - t0);
    logLine(method, path, r.status, ms, data);
    return { status: r.status, data, retryAfter: parseInt(r.headers.get('Retry-After'), 10) || null };
  } catch (e){
    const ms = Math.round(performance.now() - t0);
    logLine(method, path, 0, ms, String(e.message || e));
    return { status: 0, data: null, netError: true };
  }
}

const NET_HINT = 'Браузер не смог достучаться до API. Откройте страницу через '
  + '<code>python paygate_proxy.py</code> — у paygate нет CORS, напрямую запрос не уйдёт.';

/* ============================================================
   Учётные данные
   ============================================================ */
const NV = 'sv_paytest_cred';
function loadCred(){
  try {
    const c = JSON.parse(localStorage.getItem(NV) || 'null');
    if (c){ $('devId').value = c.id; $('devSecret').value = c.secret; }
  } catch {}
}
function saveCred(){
  localStorage.setItem(NV, JSON.stringify({id: $('devId').value.trim(), secret: $('devSecret').value.trim()}));
}
function bearer(){
  const id = $('devId').value.trim(), s = $('devSecret').value.trim();
  return (id && s) ? `${id}:${s}` : null;
}
$('devId').addEventListener('change', saveCred);
$('devSecret').addEventListener('change', saveCred);
$('btnForget').addEventListener('click', () => {
  localStorage.removeItem(NV);
  $('devId').value = ''; $('devSecret').value = '';
  msg($('devMsg'), 'info', 'Учётка забыта.');
});

/* ============================================================
   Привязка аппарата
   ============================================================ */
let enrollTimer = null, enrollDeadline = null;

$('btnEnroll').addEventListener('click', async () => {
  clearTimeout(enrollTimer);
  msg($('devMsg'), '', '');
  $('btnEnroll').disabled = true;

  const r = await api('POST', '/device/enroll', {
    body: {manufacturer: 'SmartVend test page', serial: 'PAYTEST-' + Date.now().toString().slice(-6)},
  });
  $('btnEnroll').disabled = false;

  if (r.netError){ msg($('devMsg'), 'err', NET_HINT); return; }
  if (r.status !== 200 && r.status !== 201){
    const d = r.data && r.data.detail;
    let extra = '';
    if (r.status === 422 && /panel_base_url/.test(d || ''))
      extra = ' Привязка на этом стенде <b>ещё не настроена на стороне сервера</b>. '
            + 'Оплату это не блокирует: впишите device_id и device_secret вручную выше.';
    msg($('devMsg'), 'err', `<b>Привязка недоступна:</b> HTTP ${r.status}${d ? ' — ' + esc(d) : ''}.${extra}`);
    return;
  }

  const e = r.data;
  show($('enrollBox'), true);
  $('enrollQr').innerHTML = QR.svg(e.claim_url);
  $('enrollCode').textContent = e.code;
  enrollDeadline = e.expires_at;
  const interval = (e.poll_interval_seconds || 3) * 1000;

  const tick = async () => {
    const p = await api('GET', `/device/enroll/${encodeURIComponent(e.enrollment_id)}`, {
      auth: `${e.enrollment_id}:${e.enrollment_secret}`,
    });
    if (p.status === 200){
      $('devId').value = p.data.device_id;
      $('devSecret').value = p.data.device_secret;
      saveCred();
      show($('enrollBox'), false);
      msg($('devMsg'), 'info', `<b>Аппарат привязан.</b> device_id = ${esc(String(p.data.device_id))}. Учётка сохранена в браузере.`);
      return;
    }
    if (p.status === 410){
      show($('enrollBox'), false);
      msg($('devMsg'), 'err', '<b>Код истёк.</b> Нажмите «Привязать новый аппарат» ещё раз.');
      return;
    }
    if (p.status === 401){
      show($('enrollBox'), false);
      msg($('devMsg'), 'err', '<b>401</b> — сервер не принял данные привязки.');
      return;
    }
    enrollTimer = setTimeout(tick, (p.retryAfter ? p.retryAfter*1000 : interval));
  };
  enrollTimer = setTimeout(tick, interval);
});

/* ============================================================
   Платёж
   ============================================================ */
let order = null, payTimer = null, confirmed = false;

function setState(cls, text, pulsing){
  $('payState').className = 'state ' + cls;
  $('payState').innerHTML = (pulsing ? '<span class="dot"></span>' : '') + `<span>${esc(text)}</span>`;
}

$('btnPay').addEventListener('click', async () => {
  const auth = bearer();
  if (!auth){ msg($('payMsg'), 'err', 'Сначала заполните <b>device_id</b> и <b>device_secret</b>.'); return; }
  saveCred();
  clearTimeout(payTimer);
  msg($('payMsg'), '', '');
  confirmed = false;
  show($('btnVendOk'), false); show($('btnVendFail'), false);

  const price = parseInt($('price').value, 10);
  if (!(price > 0)){ msg($('payMsg'), 'err', 'Сумма должна быть целым числом тенге больше нуля.'); return; }

  const body = {price, vm_order_id: 'pt-' + Date.now()};
  if ($('slot').value.trim())  body.slot = $('slot').value.trim();
  if ($('pname').value.trim()) body.product_name = $('pname').value.trim();

  $('btnPay').disabled = true;
  const r = await api('POST', '/device/orders', {body, auth});
  $('btnPay').disabled = false;

  if (r.netError){ msg($('payMsg'), 'err', NET_HINT); return; }
  if (r.status === 401){ msg($('payMsg'), 'err', '<b>401</b> — device_id или device_secret неверны.'); return; }
  if (r.status === 403){ msg($('payMsg'), 'err', '<b>403</b> — аппарат заблокирован оператором.'); return; }
  if (r.status === 503){
    msg($('payMsg'), 'err', `<b>503</b> — платёжный шлюз недоступен. Заказ не создан, попробуйте через ${r.retryAfter || 5} с.`);
    return;
  }
  if (r.status !== 200 && r.status !== 201){
    const d = r.data && (r.data.detail || r.data.message);
    msg($('payMsg'), 'err', `<b>HTTP ${r.status}</b>${d ? ' — ' + esc(typeof d === 'string' ? d : JSON.stringify(d)) : ''}`);
    return;
  }

  order = r.data;
  show($('payBox'), true);
  show($('btnCancel'), true);
  $('amount').textContent = `${order.amount} ₸`;
  $('payQr').innerHTML = QR.svg(order.qr_payload);
  $('payload').textContent = order.qr_payload;
  setState('s-wait', 'ждём оплату', true);
  poll();
});

async function poll(){
  if (!order) return;
  const r = await api('GET', `/device/orders/${order.id}/status`, {auth: bearer()});
  if (!order) return;

  if (r.netError){ payTimer = setTimeout(poll, 3000); return; }
  if (r.status === 429){ payTimer = setTimeout(poll, (r.retryAfter || 3)*1000); return; }
  if (r.status !== 200){ payTimer = setTimeout(poll, 3000); return; }

  const st = r.data.status;
  if (st === 'paid' && !confirmed){
    confirmed = true;
    setState('s-ok', 'оплачено — подтверждаем', true);
    // Подтверждать надо немедленно: иначе сервер вернёт деньги клиенту.
    const c = await api('POST', `/device/orders/${order.id}/confirm`, {body: {}, auth: bearer()});
    if (c.status === 200){
      setState('s-ok', 'оплачено и подтверждено');
      show($('btnVendOk'), true); show($('btnVendFail'), true); show($('btnCancel'), false);
      msg($('payMsg'), 'info', '<b>Деньги получены.</b> Отметьте, выдался ли товар — это отдельный от оплаты факт.');
    } else {
      setState('s-err', `confirm не прошёл (${c.status})`);
      msg($('payMsg'), 'err', `<b>confirm вернул ${c.status}</b> — ${esc(JSON.stringify(c.data))}. Скорее всего уже сработал возврат.`);
    }
    return;
  }
  if (st === 'confirmed'){
    setState('s-ok', 'оплачено и подтверждено');
    show($('btnVendOk'), true); show($('btnVendFail'), true); show($('btnCancel'), false);
    return;
  }
  if (st === 'expired' || st === 'refunded' || st === 'superseded'){
    setState('s-err', st === 'expired' ? 'срок QR истёк' : st === 'refunded' ? 'возврат' : 'заказ вытеснен');
    show($('btnCancel'), false);
    order = null;
    return;
  }
  payTimer = setTimeout(poll, 2000);
}

async function reportVend(ok){
  if (!order) return;
  const r = await api('POST', `/device/orders/${order.id}/vend`, {body: {vend_status: ok}, auth: bearer()});
  if (r.status === 200){
    setState(ok ? 's-ok' : 's-warn', ok ? 'продажа завершена' : 'сообщено о сбое выдачи');
    msg($('payMsg'), ok ? 'info' : '', ok
      ? '<b>Готово.</b> Полный цикл прошёл: заказ → оплата → подтверждение → выдача.'
      : '<b>Сбой выдачи отправлен.</b> Вернутся ли деньги — решает политика оператора.');
  } else {
    msg($('payMsg'), 'err', `Отчёт о выдаче не принят: HTTP ${r.status}`);
  }
  show($('btnVendOk'), false); show($('btnVendFail'), false);
  order = null;
}
$('btnVendOk').addEventListener('click', () => reportVend(true));
$('btnVendFail').addEventListener('click', () => reportVend(false));
$('btnCancel').addEventListener('click', () => {
  clearTimeout(payTimer); order = null;
  setState('s-warn', 'ожидание отменено');
  show($('btnCancel'), false);
});

/* обратные отсчёты */
setInterval(() => {
  if (order && order.expires_at && !confirmed){
    const s = secsLeft(order.expires_at);
    $('payTimer').textContent = s ? `QR действует ещё ${s} с` : 'срок QR истёк';
  }
  if (enrollDeadline && !$('enrollBox').classList.contains('hide')){
    const s = secsLeft(enrollDeadline);
    $('enrollTimer').textContent = s ? `код действует ещё ${s} с` : 'код истёк';
  }
}, 1000);

loadCred();
</script>
